<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELIX</title>
  <link rel="stylesheet" href="popup.bundle.css">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.bundle.js" defer></script>
</head>
<body>
  <div class="maxos-menu">
    <header>
      <span class="wordmark" role="img" aria-label="ELIX"></span>
    </header>
    <main>
      <section id="home">
        <p class="instructions"></p>
        <div class="home-actions">
          <button class="system-button system-button--primary" type="button" id="add-api-key" hidden>
            <span class="maxos-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </span>
            Add an API key
          </button>
          <button class="system-button system-button--secondary" type="button" id="open-settings" hidden>
            <span class="maxos-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
            Settings
          </button>
          <a class="system-button system-button--secondary" href="https://github.com/MVXMXM/ELIX" target="_blank" rel="noopener">
            <span class="maxos-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.1-.4-3.7 1.4a12.9 12.9 0 0 0-6.8 0C5.7 1.2 4.6 1.6 4.6 1.6a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.2 6.4 6.2 6.7a3.4 3.4 0 0 0-.9 2.6V22"/>
              </svg>
            </span>
            Source code
          </a>
        </div>
      </section>
      <section id="settings" aria-labelledby="settings-title" hidden>
        <div class="settings-heading">
          <button type="button" id="back-settings" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19 12H5m7 7-7-7 7-7"/>
            </svg>
          </button>
          <h1 class="menu-label" id="settings-title">Settings</h1>
        </div>
        <fieldset disabled>
          <hr>
          <div class="field" role="group" aria-labelledby="api-key-label">
            <span class="menu-label" id="api-key-label">API key</span>
            <div class="api-key-row">
              <code id="masked-api-key" aria-label="Masked API key"></code>
              <button class="key-action" type="button" id="edit-api-key" aria-label="Edit API Key" title="Edit API Key">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6"/>
                  <path d="M17 3a2.8 2.8 0 0 1 4 4l-9 9-5 1 1-5Z"/>
                </svg>
              </button>
              <button class="key-action" type="button" id="delete-api-key" aria-label="Delete API Key" title="Delete API Key">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M5 6l1 14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-14M10 10v7m4-7v7"/>
                </svg>
              </button>
            </div>
          </div>
          <hr>
          <label class="field">
            <span class="menu-label">Model</span>
            <span class="model-picker">
              <select name="model">
                <option value="gpt-6-luna">GPT-6 Luna</option>
                <option value="gpt-6.1-terra">GPT-6.1 Terra</option>
                <option value="gpt-6.1-sol">GPT-6.1 Sol</option>
              </select>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
          </label>
          <hr>
          <div class="toggle">
            <label class="menu-label" for="images-switch">Media input (alpha)</label>
            <div id="images-control"></div>
          </div>
        </fieldset>
      </section>
      <p id="status" role="status"></p>
    </main>
    <span id="version"></span>
  </div>
</body>
</html>
