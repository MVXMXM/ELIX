<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ELIX is a browser extension that explains highlighted text at the level you choose, right on the page.">
  <meta name="theme-color" content="#f8fafc">
  <link rel="icon" href="icons/elix.svg" type="image/svg+xml">
  <title>ELIX — Explain what you highlight</title>
  <style>
    @font-face {
      font-family: "Archivo:SemiBold";
      src: url("https://static.figma.com/font/Archivo_wdth_wght__1") format("woff2");
      font-style: normal;
      font-weight: 600;
    }

    @font-face {
      font-family: "Inter:Medium";
      src: url("https://static.figma.com/font/Inter_1") format("woff2");
      font-style: normal;
      font-weight: 500;
    }

    :root {
      --canvas: #f8fafc;
      --ink: #0f172b;
      --accent: #00bbff;
      font-family: system-ui, sans-serif;
      background: var(--canvas);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
    }

    main {
      width: min(100%, 32rem);
      margin-bottom: 80px;
      text-align: center;
    }

    h1 { margin: 0; }

    .wordmark {
      display: block;
      margin-inline: auto;
      max-width: 100%;
      height: auto;
    }

    .description {
      max-width: 500px;
      margin: 32px auto;
      font-family: "Inter:Medium", Inter, system-ui, sans-serif;
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.5;
      text-wrap: balance;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: .8125rem .75rem;
      border: 1px solid transparent;
      border-radius: 2.5rem;
      background: var(--accent);
      color: #fff;
      font-family: "Archivo:SemiBold", Archivo, system-ui, sans-serif;
      font-size: .875rem;
      font-weight: 600;
      font-variation-settings: "wdth" 100;
      line-height: 1;
      text-decoration: none;
    }

    .button img {
      display: block;
      flex: none;
    }

    .button:hover { background: #00a8e6; }

    .button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 6px var(--accent);
    }

  </style>
</head>
<body>
  <main>
    <h1><img class="wordmark" src="/assets/756fc.svg" alt="ELIX"></h1>
    <p class="description">
      Highlight text on a webpage and get an explanation right there,
      at the level you choose.
    </p>
    <a class="button" href="https://github.com/MVXMXM/ELIX#chromium-alpha-test">
      <img src="/assets/6ad1e.svg" alt="">
      <span>Try the alpha</span>
      <img src="/assets/22aa0.svg" alt="">
    </a>
  </main>
</body>
</html>
