<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELIX</title>
  <link rel="stylesheet" href="popup.bundle.css">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.bundle.js" defer></script>
</head>
<body>
  <div class="maxos-menu elix-popper">
    <header>
      <span class="wordmark" role="img" aria-label="ELIX"></span>
    </header>
    <main>
      <section id="home">
        <p class="instructions"></p>
        <div class="home-actions">
          <button class="system-button system-button--primary" type="button" id="add-api-key" hidden>
            <span class="maxos-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/>
                <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>
              </svg>
            </span>
            Add an API key
          </button>
          <div id="settings" hidden></div>
          <a class="system-button system-button--secondary" href="https://github.com/MVXMXM/ELIX" target="_blank" rel="noopener">
            <span class="maxos-menu-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.1-.4-3.7 1.4a12.9 12.9 0 0 0-6.8 0C5.7 1.2 4.6 1.6 4.6 1.6a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.2 6.4 6.2 6.7a3.4 3.4 0 0 0-.9 2.6V22"/>
              </svg>
            </span>
            View source code
          </a>
        </div>
      </section>
      <p id="status" role="status"></p>
    </main>
    <footer class="popper-footer">
      <span id="version"></span>
      <span aria-hidden="true">•</span>
      <span>Built by <a href="https://www.mvxmxm.com" target="_blank" rel="noopener">Maximillian Piras</a></span>
      <span aria-hidden="true">•</span>
      <a href="https://elix.fyi/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
    </footer>
  </div>
</body>
</html>
