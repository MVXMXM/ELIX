<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ELIX explains anything you highlight, at the level that fits you."
    />
    <title>ELIX — Understand anything</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>ELIX</h1>
      <p class="intro">
        In situ explanations with calibrated complexity. Try it by highlighting
        any word on this page.
      </p>
      <a
        class="button"
        href="https://github.com/MVXMXM/ELIX"
        target="_blank"
        rel="noreferrer"
      >
        Try early preview
      </a>
    </main>
    <div class="selection-action" hidden>
      <button type="button">Explain selection</button>
    </div>
    <aside class="explanation" hidden aria-live="polite">
      <button class="close-explanation" type="button" aria-label="Close explanation">
        ×
      </button>
      <p class="explanation-label">ELIX</p>
      <p class="explanation-status">Thinking...</p>
      <p class="explanation-result"></p>
    </aside>
    <script src="script.js"></script>
  </body>
</html>
