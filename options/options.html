<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ELIX options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <p class="brand">ELIX</p>
      <h1>Options</h1>
      <p class="lede">
        Bring your own OpenAI API key. It stays in extension storage and is used
        only by the background service worker.
      </p>

      <form id="settings-form">
        <label>
          <span>API key</span>
          <input
            id="apiKey"
            name="apiKey"
            type="password"
            autocomplete="off"
            placeholder="sk-..."
            required
          />
        </label>

        <label>
          <span>Model</span>
          <input
            id="model"
            name="model"
            type="text"
            value="gpt-4o-mini"
            placeholder="gpt-4o-mini"
          />
        </label>

        <label>
          <span>API base URL</span>
          <input
            id="baseUrl"
            name="baseUrl"
            type="url"
            value="https://api.openai.com/v1"
            placeholder="https://api.openai.com/v1"
          />
        </label>

        <div class="actions">
          <button type="submit">Save</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
