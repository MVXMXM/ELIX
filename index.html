<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ELIX is a browser extension that explains highlighted text at the level you choose, right on the page.">
  <meta name="theme-color" content="#f8fafc">
  <link rel="icon" href="icons/elix.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/llm-loader.css">
  <title>ELIX — Explain what you highlight</title>
  <style>
    @font-face {
      font-family: "Archivo:SemiBold";
      src: url("https://static.figma.com/font/Archivo_wdth_wght__1") format("woff2");
      font-style: normal;
      font-weight: 600;
    }

    @font-face {
      font-family: "Inter:Medium";
      src: url("https://static.figma.com/font/Inter_1") format("woff2");
      font-style: normal;
      font-weight: 500;
    }

    :root {
      --canvas: #f8fafc;
      --ink: #0f172b;
      --accent: #00bbff;
      font-family: system-ui, sans-serif;
      background: var(--canvas);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem 8rem;
    }

    main {
      width: min(100%, 32rem);
      text-align: left;
    }

    h1 { margin: 0; }

    .wordmark {
      display: block;
      height: auto;
      box-sizing: content-box;
      max-width: calc(100% - 16px);
      margin-inline-start: -8px;
      padding: 8px;
      background: color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .explain-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 6px;
      margin-top: 16px;
      color: #45556c;
      font: 400 14px/1 Inter, system-ui, sans-serif;
    }

    .description {
      display: grid;
      align-items: start;
      max-width: 500px;
      margin: 16px 0 32px;
      font-family: "Inter:Medium", Inter, system-ui, sans-serif;
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.5;
      text-wrap: pretty;
    }

    .description > * {
      grid-area: 1 / 1;
      margin: 0;
    }

    .explanation-sizing {
      visibility: hidden;
      pointer-events: none;
    }

    .description .maxos-llm-loader {
      justify-self: start;
      --font-inter: "Inter:Medium", Inter, system-ui;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: .8125rem .75rem;
      border: 1px solid transparent;
      border-radius: 2.5rem;
      background: #1a1a1a;
      color: #fff;
      font-family: "Archivo:SemiBold", Archivo, system-ui, sans-serif;
      font-size: .875rem;
      font-weight: 600;
      font-variation-settings: "wdth" 100;
      line-height: 1;
      text-decoration: none;
    }

    .button img {
      display: block;
      flex: none;
    }

    .button:hover { background: #333; }

    .button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 6px var(--accent);
    }

    .landing-dock {
      position: fixed;
      inset: auto 1.5rem 16px;
      display: grid;
      justify-items: center;
      gap: 16px;
      background: var(--canvas);
    }

    .landing-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 4px 8px;
      color: #62748e;
      font-size: .6875rem;
      text-align: center;
    }

    .landing-footer a {
      color: inherit;
      text-underline-offset: 2px;
    }

    .landing-version {
      font-family: ui-monospace, monospace;
      font-variant-numeric: slashed-zero;
    }
  </style>
</head>
<body>
  <main>
    <h1><img class="wordmark" src="icons/elix-wordmark.svg" width="180" height="60" alt="ELIX"></h1>
    <div class="explain-bar">
      <span>Explain like I'm</span>
      <span id="explain-options"></span>
      <template id="explain-controls">
        <style>
          .age-selector {
            --font-inter: "ELIX Inter";
            --surface: #fcfcfc;
            display: flex;
            align-items: center;
            height: 30px;
          }

          .age-selector .segmented-controller {
            --background-alt: #e2e8f0;
            gap: 2px;
            padding: 2px;
          }

          .age-selector .segmented-controller :is(.segmented-controller-button, .segmented-controller-label) {
            padding: 5px 8px;
          }

          .age-selector .segmented-controller-button[aria-pressed="false"] {
            color: #62748e;
          }

          .age-selector .segmented-controller-indicator {
            background: #45556c;
          }

          .age-selector .segmented-controller-button:disabled {
            cursor: default;
          }

          .age-selector .segmented-controller-button:disabled::before {
            display: none;
          }
        </style>
        <div class="age-selector"></div>
      </template>
    </div>
    <div class="description">
      <p id="explanation" aria-live="polite" aria-atomic="true">ELIX is a little helper in Chrome. If you see a word or picture you don’t understand, pick it and ELIX will tell you what it means right there.</p>
      <span class="maxos-llm-loader" role="status" hidden>Thinking…</span>
    </div>
  </main>
  <div class="landing-dock">
    <a class="button" href="https://github.com/MVXMXM/ELIX">
      <img src="/assets/github.svg" alt="">
      <span>View source code</span>
      <img src="/assets/external-link.svg" alt="">
    </a>
    <footer class="landing-footer">
      <span class="landing-version">v<!-- extension-version -->0.0.10</span>
      <span aria-hidden="true">•</span>
      <span>Built by <a href="https://www.mvxmxm.com">Maximillian Piras</a></span>
      <span aria-hidden="true">•</span>
      <a href="privacy.html">Privacy Policy</a>
    </footer>
  </div>
  <script src="assets/age-selector.bundle.js"></script>
  <script>
    const explanation = document.querySelector("#explanation");
    const explanations = {
      5: explanation.textContent,
      10: "ELIX is a Chrome extension that helps when you get stuck reading or looking at something online. Highlight a confusing bit of text or select part of a picture, and ELIX explains it on the same page.",
      15: "ELIX explains unfamiliar ideas while you browse. Select text or part of an image to get an explanation on the page you’re already reading.",
      20: "A Chrome extension to explain things without interrupting your flow. Highlight text or select an image crop for an in-situ explanation tailored to you.",
    };
    const loader = document.querySelector(".maxos-llm-loader");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    let pendingUpdate;

    // Reserve enough room for every explanation at the current viewport width.
    for (const copy of Object.values(explanations)) {
      const sizingCopy = document.createElement("span");
      sizingCopy.className = "explanation-sizing";
      sizingCopy.setAttribute("aria-hidden", "true");
      sizingCopy.textContent = copy;
      explanation.parentElement.append(sizingCopy);
    }

    function showExplanation(copy) {
      clearTimeout(pendingUpdate);
      explanation.setAttribute("aria-busy", "true");
      explanation.textContent = "";
      loader.hidden = false;

      pendingUpdate = setTimeout(() => {
        loader.hidden = true;
        const chunks = copy.match(/\S+\s*/g);
        let visibleWords = 0;

        function stream() {
          visibleWords = reducedMotion.matches ? chunks.length : visibleWords + 2;
          explanation.textContent = chunks.slice(0, visibleWords).join("");
          if (visibleWords < chunks.length) {
            pendingUpdate = setTimeout(stream, 32);
          } else {
            explanation.setAttribute("aria-busy", "false");
          }
        }

        stream();
      }, 450);
    }

    const controls = document.querySelector("#explain-options").attachShadow({ mode: "open" });
    controls.append(document.querySelector("#explain-controls").content.cloneNode(true));
    let age = "5";
    const renderSelector = ElixAgeSelector.mount(
      controls.querySelector(".age-selector"),
      Object.keys(explanations),
      nextAge => {
        if (nextAge === age || nextAge === "other") return;
        age = nextAge;
        updateSelector();
        showExplanation(explanations[age]);
      }
    );

    function updateSelector() {
      renderSelector(age, "", false);
      const other = controls.querySelector("button[aria-expanded]");
      other.disabled = true;
      other.title = "Custom personas are available in the extension";
    }

    updateSelector();
  </script>
</body>
</html>
